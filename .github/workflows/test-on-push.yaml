name: Test on push
description: Test on push

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/test*.yaml
      # The suite executes the examples in the hand-written pages, so a
      # change to one of those can turn it red on its own.
      - README.md
      - docs/**
  pull_request:
    # `ready_for_review` so marking a draft ready triggers the suite.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/test*.yaml
      # The suite executes the examples in the hand-written pages, so a
      # change to one of those can turn it red on its own.
      - README.md
      - docs/**

permissions:
  contents: read

jobs:
  tests:
    # Skip on draft PRs; pushes to main and ready PRs still run. Mark the PR
    # ready for review (or push to main) to run the matrix.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    uses: ./.github/workflows/test-matrix.yaml
